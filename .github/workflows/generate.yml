# Generate a campaign's STLs from the GitHub UI: Actions -> "generate dividers" -> Run workflow.
# The zip appears under the run's Artifacts a couple of minutes later.
name: generate dividers
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign
        type: choice
        default: "eoe  Edge of the Earth"
        options:
          - "core  Night of the Zealot"
          - "rtnotz  Return to the Night of the Zealot"
          - "dwl  The Dunwich Legacy"
          - "rtdwl  Return to the Dunwich Legacy"
          - "ptc  The Path to Carcosa"
          - "rtptc  Return to the Path to Carcosa"
          - "tfa  The Forgotten Age"
          - "rttfa  Return to the Forgotten Age"
          - "tcu  The Circle Undone"
          - "rttcu  Return to the Circle Undone"
          - "tde  The Dream-Eaters"
          - "tic  The Innsmouth Conspiracy"
          - "eoe  Edge of the Earth"
          - "tsk  The Scarlet Keys"
          - "fhv  The Feast of Hemlock Vale"
          - "tdc  The Drowned City"
      lang:
        description: Language
        type: choice
        default: pl
        options: [pl, en, de, es, fr, it, ko, pt, ru, vi, zh, zh_cn]
      include_return:
        description: Include Return to... sets and scenarios
        type: boolean
        default: false
      pattern:
        description: Body pattern
        type: choice
        default: hex
        options: [hex, grid, solid]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libgomp1
      - run: pip install cadquery shapely fonttools numpy
      - name: render
        run: |
          CODE="${INPUT_CAMPAIGN%% *}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          python arkham_dividers.py --campaign "$CODE" --lang "$INPUT_LANG" --pattern "$INPUT_PATTERN" $([ "$INPUT_RETURN" = "true" ] && echo --include-return)
        env:
          INPUT_CAMPAIGN: ${{ inputs.campaign }}
          INPUT_LANG: ${{ inputs.lang }}
          INPUT_PATTERN: ${{ inputs.pattern }}
          INPUT_RETURN: ${{ inputs.include_return }}
        id: render
      - uses: actions/upload-artifact@v4
        with:
          name: arkham_dividers_${{ steps.render.outputs.code }}_${{ inputs.lang }}_${{ inputs.pattern }}
          path: out/${{ steps.render.outputs.code }}_${{ inputs.lang }}
          retention-days: 30
