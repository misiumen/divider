name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pwsh build.ps1
      - run: Compress-Archive -Path dist/ArkhamDividers -DestinationPath ArkhamDividers-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ArkhamDividers-windows
          path: ArkhamDividers-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ArkhamDividers-windows.zip
